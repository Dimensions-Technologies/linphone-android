pool:
  vmImage: 'ubuntu-latest'

variables:
- name: GRADLE_USER_HOME
  value: $(Pipeline.Workspace)/.gradle

steps:
- checkout: self

- task: Cache@2
  displayName: "Restore Gradle cache"
  inputs:
    # Restores the most recent cache and saves a new one under this run's build ID, so the Gradle build
    # cache keeps up with the code. Only content not already stored is uploaded.
    key: 'gradle | "$(Agent.OS)" | "$(Build.BuildId)"'
    restoreKeys: |
      gradle | "$(Agent.OS)"
    path: $(GRADLE_USER_HOME)

- task: JavaToolInstaller@0
  displayName: "Install Java"
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

# Need keystore.properties present even if build isn't using it
- task: Bash@3
  displayName: "Generate keystore.properties"
  inputs:
    targetType: 'inline'
    script: |
      echo storePassword=password >> keystore.properties
      echo keyPassword=passsword >> keystore.properties
      echo keyAlias=alias >> keystore.properties
      echo storeFile=file >> keystore.properties

- task: Gradle@3
  displayName: "Build SDK"
  inputs:
    gradleWrapperFile: 'gradlew'
    tasks: 'assembleDebug'
    publishJUnitResults: false
    javaHomeOption: 'JDKVersion'
    sonarQubeRunAnalysis: false
    spotBugsAnalysis: false

# Stops the Gradle daemon so it releases its cache files before Cache@2 saves them at the end of the job.
- task: Bash@3
  displayName: "Stop Gradle daemon"
  condition: always()
  inputs:
    targetType: 'inline'
    script: './gradlew --stop'

- task: PublishBuildArtifacts@1
  displayName: "Publish SDK"
  inputs:
    PathtoPublish: 'app/build/outputs'
    ArtifactName: 'apk-debug'
    publishLocation: 'container'
